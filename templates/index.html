<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TAPIN - Tanya Pindad</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <img src="{{ url_for('static', filename='ptpindad.png') }}" alt="Logo Pindad" class="logo">
            <h2>Selamat Datang di PT Pindad (Persero)</h2>
            <p class="tapin-text">TAPIN<br>(Tanya Pindad)</p>
        </div>
        <div class="right-panel {% if user_message %}after-question{% endif %}">
            <h2>TAPIN<br>(Tanya Pindad)</h2>

            {% if not user_message %}
                <p class="prompt-text">Mau tau seputar PT Pindad?</p>
            {% endif %}

            {% if user_message %}
                <div class="chat-box">
                    <p><strong>Anda:</strong> {{ user_message }}</p>
                    <p><strong>Tapin:</strong> {{ bot_response }}</p>
                </div>
            {% endif %}

            <form method="post" class="chat-form">
                <input type="text" name="message" placeholder="Ask Pindad" autocomplete="off" required>
                <button type="button" id="micBtn" onclick="startListening()" title="Klik untuk bicara 🎤">🎤</button>
                <button type="submit">↵</button>
                <div id="listeningIndicator" style="margin-left: 10px; display: none; font-size: 12px; color: red;">🔴 Mendengarkan...</div>
            </form>
        </div>

        <div class="bottom-right-logout">
            <form action="{{ url_for('logout') }}" method="get">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

<script>
    const micBtn = document.getElementById('micBtn');
    const indicator = document.getElementById('listeningIndicator');
    const inputField = document.getElementById('messageInput');

    function startListening() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'id-ID';
        recognition.interimResults = false;

        // Ubah tampilan saat mulai
        indicator.style.display = 'inline';
        micBtn.style.backgroundColor = '#f44336'; // merah
        micBtn.style.color = 'white';

        recognition.start();

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            inputField.value = transcript;

            // ✅ Suara notifikasi
            const audio = new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg');
            audio.play();

            // Auto-submit
            setTimeout(() => {
                inputField.form.submit();
            }, 500);
        };

        recognition.onerror = function(event) {
            alert('Gagal mengenali suara: ' + event.error);
        };

        recognition.onend = function() {
            // Balikin tampilan
            indicator.style.display = 'none';
            micBtn.style.backgroundColor = ''; // reset warna
            micBtn.style.color = '';
        };
    }
</script>


</body>
</html>
